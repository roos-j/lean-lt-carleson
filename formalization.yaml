fidelity:
  divergences: >-
    (1) The Carleson operator uses Mathlib's Fourier transform with the kernel
    exp(2 pi i <x, xi>); the paper writes exp(i x xi) without fixing a Fourier normalization. The
    two versions differ by rescaling the multiplier, which preserves the multiplier class and
    changes its norm by a constant depending only on n, alpha and nu. (2) The estimate is stated
    for Schwartz functions (a priori form); the paper does not state the class of f. (3) The
    normalization alpha_1 = 1 of the paper is not assumed, and n >= 1 is an explicit hypothesis.
    (4) Partial derivatives are expressed through iterated Frechet derivatives evaluated at
    standard basis vectors. (5) Carleson's theorem is stated for 2 pi-periodic functions on R with
    square integrability on [0, 2 pi) and Mathlib's Fourier coefficients. The proof of Theorem 1.1
    departs from the paper in several places, where steps were corrected or reorganized: trees
    are allowed a top outside the collection, the mass and energy lemmas are proved in threshold
    form, the initial energy bound of the iteration is replaced by the finite energy of the
    finite collection, and the two-tree estimate uses a pointwise mean value bound instead of the
    kernel estimates (4.14) and (7.17)-(7.29). The files automation/Status.md and
    automation/instructions.md record the step-by-step correspondence with the paper.

